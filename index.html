<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bv-trip · Panel de Administración</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen">

  <div id="app" class="max-w-4xl mx-auto p-4">
    <header class="flex justify-between items-center mb-6 bg-white p-4 rounded-xl shadow-sm">
      <h1 class="text-xl font-bold text-emerald-800 flex items-center gap-2">🚐 Bv-trip · Panel</h1>
      <button id="btnLogout" class="hidden bg-emerald-50 text-emerald-700 px-4 py-2 rounded-lg text-sm font-semibold hover:bg-emerald-100">Salir</button>
    </header>

    <div id="loginSection" class="bg-white p-6 rounded-xl shadow-sm max-w-sm mx-auto mt-12">
      <h2 class="text-lg font-bold mb-4 text-center">Iniciar Sesión</h2>
      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-xs text-gray-500 mb-1">Correo electrónico</label>
          <input type="email" id="email" required class="w-full border rounded-lg p-2 text-sm bg-gray-50 focus:bg-white">
        </div>
        <div>
          <label class="block text-xs text-gray-500 mb-1">Contraseña</label>
          <input type="password" id="password" required class="w-full border rounded-lg p-2 text-sm bg-gray-50 focus:bg-white">
        </div>
        <button type="submit" class="w-full bg-emerald-700 text-white py-2 rounded-lg text-sm font-semibold hover:bg-emerald-800">Entrar</button>
      </form>
      <p id="loginError" class="text-red-600 text-xs mt-3 text-center hidden"></p>
    </div>

    <div id="mainContent" class="hidden space-y-6">
      <div class="flex gap-2">
        <button id="tabSalidas" class="flex-1 bg-emerald-800 text-white py-2.5 rounded-xl text-sm font-semibold shadow-sm">Salidas</button>
        <button id="tabConductores" class="flex-1 bg-white text-gray-700 py-2.5 rounded-xl text-sm font-semibold border hover:bg-gray-50">Conductores</button>
        <button id="btnRefresh" class="bg-white p-2.5 rounded-xl border hover:bg-gray-50">🔄</button>
      </div>

      <div id="secSalidas" class="space-y-4">
        <div class="bg-white p-4 rounded-xl border flex gap-2 items-center">
          <input type="date" id="filterDate" class="border rounded-lg p-2 text-sm flex-1 bg-gray-50">
          <button id="btnVerTodas" class="bg-emerald-100 text-emerald-800 px-3 py-2 rounded-lg text-xs font-semibold">Ver todas</button>
        </div>
        <div id="listaSalidas" class="space-y-3">
          <p class="text-sm text-gray-500 text-center py-4">Cargando viajes...</p>
        </div>
      </div>

      <div id="secConductores" class="hidden space-y-4">
        <div class="bg-white p-4 rounded-xl border space-y-2">
          <p class="text-xs text-gray-500">Período para el wallet y el estado de cuenta</p>
          <div class="flex flex-wrap gap-2 items-center">
            <input type="date" id="rangoDesde" class="border rounded-lg p-2 text-sm bg-gray-50 flex-1 min-w-[130px]">
            <input type="date" id="rangoHasta" class="border rounded-lg p-2 text-sm bg-gray-50 flex-1 min-w-[130px]">
            <button id="btnSemana" class="bg-emerald-100 text-emerald-800 px-3 py-2 rounded-lg text-xs font-semibold">Esta semana</button>
          </div>
        </div>
        <div id="listaConductores" class="space-y-3">
          <p class="text-sm text-gray-500 text-center py-4">Cargando conductores...</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBROavzajg4VH80lsQVhvDo8sRsvrY6veA",
      authDomain: "bv-trip.firebaseapp.com",
      projectId: "bv-trip",
      storageBucket: "bv-trip.firebasestorage.app",
      messagingSenderId: "668569482252",
      appId: "1:668569482252:web:4695f65a62f0363ec22a29"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);

    const auth = firebase.auth();
    const db = firebase.firestore();
    const TARIFA_POR_PASAJERO = 900;

    const $ = id => document.getElementById(id);
    let viajesCache = [];
    let conductoresCache = [];

    // ---------- Utilidades ----------
    // Evita que texto escrito por pasajeros/conductores rompa o inyecte HTML
    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    }
    const norm = s => String(s ?? '').trim().toLowerCase();
    const estaAprobado = c => c.aprobado === true || norm(c.estado) === 'aprobado';
    const estaCompletado = v => norm(v.estado) === 'completado';
    function telWA(t) {
      let d = String(t ?? '').replace(/\D/g, '');
      if (!d) return '';
      if (d.startsWith('0')) d = '58' + d.slice(1);
      return d;
    }
    function nombreConductor(v) {
      return v.conductorNombre || v.conductor || '';
    }
    // Busca el conductor del viaje SOLO si hay un dato real con qué comparar
    function buscarConductor(v) {
      if (v.conductorId) {
        const porId = conductoresCache.find(c => c.id === v.conductorId);
        if (porId) return porId;
      }
      const nom = nombreConductor(v);
      if (nom) return conductoresCache.find(c => c.nombre && c.nombre === nom) || null;
      return null;
    }
    function pasajerosDe(v) {
      return v.pasajerosCount || (Array.isArray(v.pasajeros) ? v.pasajeros.length : 1);
    }

    // ---------- Autenticación ----------
    auth.onAuthStateChanged(user => {
      if (user) {
        $('loginSection').classList.add('hidden');
        $('mainContent').classList.remove('hidden');
        $('btnLogout').classList.remove('hidden');
        cargarDatos();
      } else {
        $('loginSection').classList.remove('hidden');
        $('mainContent').classList.add('hidden');
        $('btnLogout').classList.add('hidden');
      }
    });

    $('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      $('loginError').classList.add('hidden');
      try {
        await auth.signInWithEmailAndPassword($('email').value, $('password').value);
      } catch (err) {
        $('loginError').textContent = "Error: " + err.message;
        $('loginError').classList.remove('hidden');
      }
    });
    $('btnLogout').addEventListener('click', () => auth.signOut());

    // ---------- Pestañas ----------
    const on = "flex-1 bg-emerald-800 text-white py-2.5 rounded-xl text-sm font-semibold shadow-sm";
    const off = "flex-1 bg-white text-gray-700 py-2.5 rounded-xl text-sm font-semibold border hover:bg-gray-50";
    $('tabSalidas').addEventListener('click', () => {
      $('tabSalidas').className = on; $('tabConductores').className = off;
      $('secSalidas').classList.remove('hidden'); $('secConductores').classList.add('hidden');
    });
    $('tabConductores').addEventListener('click', () => {
      $('tabConductores').className = on; $('tabSalidas').className = off;
      $('secConductores').classList.remove('hidden'); $('secSalidas').classList.add('hidden');
    });
    $('btnRefresh').addEventListener('click', cargarDatos);
    $('filterDate').addEventListener('change', renderSalidas);
    $('btnVerTodas').addEventListener('click', () => { $('filterDate').value = ''; renderSalidas(); });

    // Semana actual (lunes a domingo) como período por defecto
    function isoLocal(d) {
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }
    function fijarSemanaActual() {
      const hoy = new Date();
      const dif = (hoy.getDay() + 6) % 7; // lunes = 0
      const lun = new Date(hoy); lun.setDate(hoy.getDate() - dif);
      const dom = new Date(lun); dom.setDate(lun.getDate() + 6);
      $('rangoDesde').value = isoLocal(lun);
      $('rangoHasta').value = isoLocal(dom);
    }
    fijarSemanaActual();
    $('btnSemana').addEventListener('click', () => { fijarSemanaActual(); renderConductores(); });
    $('rangoDesde').addEventListener('change', renderConductores);
    $('rangoHasta').addEventListener('change', renderConductores);

    // ---------- Datos ----------
    async function cargarDatos() {
      try {
        const [cSnap, vSnap] = await Promise.all([
          db.collection('conductores').get(),
          db.collection('viaje').get()
        ]);
        conductoresCache = cSnap.docs.map(d => ({ id: d.id, ...d.data() }));
        viajesCache = vSnap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderSalidas();
        renderConductores();
      } catch (err) {
        console.error(err);
        $('listaSalidas').innerHTML = `<p class="text-sm text-red-600 text-center py-4 bg-white rounded-xl border">Error al cargar: ${esc(err.message)}</p>`;
      }
    }

    // ---------- Salidas ----------
    function renderSalidas() {
      const cont = $('listaSalidas');
      cont.innerHTML = '';
      const fecha = $('filterDate').value;

      let lista = viajesCache.slice();
      if (fecha) lista = lista.filter(v => v.fecha === fecha);
      lista.sort((a, b) => ((a.fecha || '') + (a.hora || '')).localeCompare((b.fecha || '') + (b.hora || '')));

      if (lista.length === 0) {
        cont.innerHTML = '<p class="text-sm text-gray-500 text-center py-4 bg-white rounded-xl border">No hay viajes para mostrar.</p>';
        return;
      }

      const aprobados = conductoresCache.filter(estaAprobado);

      lista.forEach(v => {
        const cond = buscarConductor(v);
        const pasajeros = pasajerosDe(v);
        const total = (typeof v.monto === 'number' ? v.monto : pasajeros * TARIFA_POR_PASAJERO);
        const completado = estaCompletado(v);
        const estado = v.estado || 'Pendiente';
        const nomCond = cond ? cond.nombre : nombreConductor(v);
        const tel = cond ? telWA(cond.telefono) : '';

        const opciones = aprobados.map(c =>
          `<option value="${esc(c.id)}" ${c.id === v.conductorId ? 'selected' : ''}>${esc(c.nombre || 'Sin nombre')}</option>`
        ).join('');

        const card = document.createElement('div');
        card.className = "bg-white p-4 rounded-xl border shadow-sm space-y-3";
        card.innerHTML = `
          <div class="flex justify-between items-start">
            <div>
              <span class="text-xs px-2 py-0.5 rounded font-semibold ${completado ? 'bg-emerald-100 text-emerald-800' : 'bg-yellow-100 text-yellow-800'}">${esc(estado)}</span>
              <h3 class="font-bold text-base mt-1">${esc(v.sube || v.origen || 'Origen')} ➔ ${esc(v.baja || v.destino || 'Destino')}</h3>
              <p class="text-xs text-gray-500">📅 ${esc(v.fecha || 'Sin fecha')} · 🕒 ${esc(v.hora || 'Sin hora')}</p>
              <p class="text-xs text-gray-600 mt-1">👤 ${esc(v.nombre || 'Sin nombre')}${v.puesto ? ' · 💺 ' + esc(v.puesto) : ''}${v.telefono ? ' · 📱 ' + esc(v.telefono) : ''}</p>
              ${v.referencia ? `<p class="text-xs text-gray-400">Ref. pago: ${esc(v.referencia)}${v.banco ? ' · ' + esc(v.banco) : ''}</p>` : ''}
            </div>
            <div class="text-right">
              <p class="text-xs text-gray-500">${pasajeros} pasajero(s)</p>
              <p class="font-bold text-emerald-700 text-sm">${Number(total).toLocaleString('es-VE')} Bs.</p>
            </div>
          </div>

          <div class="border-t pt-2 space-y-2 text-xs">
            <div>
              <span class="text-gray-500">Conductor:</span>
              <strong>${esc(nomCond || 'Sin asignar')}</strong>
            </div>
            <div class="flex flex-wrap gap-2 items-center">
              ${!completado ? `
                <select id="sel-${esc(v.id)}" class="border rounded-lg p-1.5 bg-gray-50 flex-1 min-w-[140px]">
                  <option value="">Elegir conductor aprobado</option>
                  ${opciones}
                </select>
                <button onclick="asignarConductor('${esc(v.id)}')" class="bg-blue-600 text-white px-3 py-1.5 rounded-lg hover:bg-blue-700">Asignar</button>
                <button onclick="completarViaje('${esc(v.id)}')" class="bg-emerald-700 text-white px-3 py-1.5 rounded-lg hover:bg-emerald-800">✓ Finalizar</button>
              ` : ''}
              ${tel ? `
                <a href="https://wa.me/${tel}?text=${encodeURIComponent('Hola ' + cond.nombre + ', tienes un viaje asignado para el ' + (v.fecha || '') + ' a las ' + (v.hora || '') + '.')}" target="_blank" rel="noopener" class="bg-green-500 text-white px-3 py-1.5 rounded-lg hover:bg-green-600">Avisar WS</a>
              ` : ''}
            </div>
          </div>
        `;
        cont.appendChild(card);
      });
    }

    async function asignarConductor(viajeId) {
      const sel = $('sel-' + viajeId);
      const cid = sel ? sel.value : '';
      if (!cid) return alert('Elige un conductor aprobado.');
      const c = conductoresCache.find(x => x.id === cid);
      if (!c) return alert('Conductor no encontrado.');
      try {
        await db.collection('viaje').doc(viajeId).update({
          conductorId: c.id,
          conductorNombre: c.nombre || ''
        });
        await cargarDatos();
      } catch (err) {
        alert('Error al asignar conductor: ' + err.message);
      }
    }

    async function completarViaje(viajeId) {
      const v = viajesCache.find(x => x.id === viajeId);
      if (v && !v.conductorId && !nombreConductor(v)) {
        if (!confirm('Este viaje no tiene conductor asignado. ¿Finalizar de todas formas?')) return;
      }
      try {
        await db.collection('viaje').doc(viajeId).update({ estado: 'Completado' });
        await cargarDatos();
      } catch (err) {
        alert('Error al actualizar estado del viaje: ' + err.message);
      }
    }

    // ---------- Conductores ----------
    function renderConductores() {
      const cont = $('listaConductores');
      cont.innerHTML = '';

      if (conductoresCache.length === 0) {
        cont.innerHTML = '<p class="text-sm text-gray-500 text-center py-4 bg-white rounded-xl border">No hay conductores registrados.</p>';
        return;
      }

      conductoresCache.forEach(c => {
        const suyos = viajesDeConductor(c);
        const totalPas = suyos.reduce((s, v) => s + pasajerosDe(v), 0);
        const acumulado = suyos.reduce((s, v) => s + (typeof v.monto === 'number' ? v.monto : pasajerosDe(v) * TARIFA_POR_PASAJERO), 0);
        const aprobado = estaAprobado(c);
        const vehiculo = [c.marca, c.modelo, c.color, c.placa].filter(Boolean).join(' ') || c.vehiculo || 'Vehículo no indicado';

        const card = document.createElement('div');
        card.className = "bg-white p-4 rounded-xl border shadow-sm space-y-3";
        card.innerHTML = `
          <div class="flex justify-between items-start gap-2">
            <div>
              <h3 class="font-bold text-base">${esc(c.nombre || 'Conductor sin nombre')}</h3>
              <p class="text-xs text-gray-500">📱 ${esc(c.telefono || 'Sin teléfono')} · 🚗 ${esc(vehiculo)}</p>
              <p class="text-xs text-gray-400">Licencia: ${esc(c.licencia || '—')} · Experiencia: ${esc(c.experienciaAños || c.experienciaAnios || '—')} años</p>
            </div>
            <span class="text-xs px-2 py-1 rounded whitespace-nowrap ${aprobado ? 'bg-emerald-100 text-emerald-800' : 'bg-gray-100 text-gray-600'}">${aprobado ? 'Aprobado' : 'Pendiente'}</span>
          </div>

          <div class="bg-emerald-50 p-3 rounded-lg flex justify-between items-center text-xs">
            <div>
              <p class="text-gray-600">Viajes completados: <strong>${suyos.length}</strong></p>
              <p class="text-gray-600">Pasajeros llevados: <strong>${totalPas}</strong></p>
            </div>
            <div class="text-right">
              <p class="text-gray-500">Wallet / Ganancia</p>
              <p class="text-base font-extrabold text-emerald-800">${acumulado.toLocaleString('es-VE')} Bs.</p>
            </div>
          </div>

          <div class="flex flex-wrap gap-2 text-xs">
            <button onclick="estadoCuenta('${esc(c.id)}')" class="bg-blue-600 text-white px-3 py-1.5 rounded-lg hover:bg-blue-700">📄 Estado de cuenta</button>
            ${aprobado
              ? `<button onclick="cambiarEstadoConductor('${esc(c.id)}','pendiente')" class="bg-gray-200 text-gray-700 px-3 py-1.5 rounded-lg hover:bg-gray-300">Suspender</button>`
              : `<button onclick="cambiarEstadoConductor('${esc(c.id)}','aprobado')" class="bg-emerald-700 text-white px-3 py-1.5 rounded-lg hover:bg-emerald-800">Aprobar</button>`}
          </div>
        `;
        cont.appendChild(card);
      });
    }

    function viajesDeConductor(c) {
      const d = $('rangoDesde').value, h = $('rangoHasta').value;
      return viajesCache
        .filter(v => estaCompletado(v) && (v.conductorId === c.id || (!v.conductorId && c.nombre && nombreConductor(v) === c.nombre)))
        .filter(v => (!d || (v.fecha && v.fecha >= d)) && (!h || (v.fecha && v.fecha <= h)))
        .sort((a, b) => ((a.fecha || '') + (a.hora || '')).localeCompare((b.fecha || '') + (b.hora || '')));
    }
    const fmtFecha = iso => iso ? iso.split('-').reverse().join('/') : '—';

    // Abre un reporte imprimible; en el diálogo de impresión elige "Guardar como PDF"
    function estadoCuenta(id) {
      const c = conductoresCache.find(x => x.id === id);
      if (!c) return;
      const lista = viajesDeConductor(c);
      const monto = v => (typeof v.monto === 'number' ? v.monto : pasajerosDe(v) * TARIFA_POR_PASAJERO);
      const total = lista.reduce((s, v) => s + monto(v), 0);
      const pas = lista.reduce((s, v) => s + pasajerosDe(v), 0);
      const vehiculo = [c.marca, c.modelo, c.color, c.placa].filter(Boolean).join(' ') || '—';
      const desde = $('rangoDesde').value, hasta = $('rangoHasta').value;
      const periodo = (desde || hasta) ? `${fmtFecha(desde)} al ${fmtFecha(hasta)}` : 'Todos los viajes';

      const filas = lista.length ? lista.map(v => `
        <tr>
          <td>${esc(fmtFecha(v.fecha))}</td>
          <td>${esc(v.hora || '')}</td>
          <td>${esc(v.sube || v.origen || '')} → ${esc(v.baja || v.destino || '')}</td>
          <td>${esc(v.nombre || '')}</td>
          <td>${esc(v.puesto || '')}</td>
          <td class="r">${monto(v).toLocaleString('es-VE')}</td>
        </tr>`).join('') : '<tr><td colspan="6" style="text-align:center;color:#666;padding:18px">Sin viajes completados en este período.</td></tr>';

      const html = `<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">
        <title>Estado de cuenta - ${esc(c.nombre || 'Conductor')}</title>
        <style>
          body{font-family:Arial,Helvetica,sans-serif;color:#12201a;margin:32px;font-size:13px}
          h1{font-size:20px;margin:0;color:#176a45} h2{font-size:15px;margin:22px 0 6px}
          .top{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #176a45;padding-bottom:10px}
          .info p{margin:3px 0} table{width:100%;border-collapse:collapse;margin-top:8px}
          th,td{border:1px solid #ccd5cf;padding:6px 8px;text-align:left} th{background:#e8f3ed}
          .r{text-align:right} .tot td{font-weight:bold;background:#f3f7f5}
          .firmas{display:flex;gap:40px;margin-top:60px}
          .firmas div{flex:1;border-top:1px solid #333;text-align:center;padding-top:4px;font-size:12px}
          .nota{margin-top:20px;font-size:11px;color:#666}
          @media print{body{margin:14mm}}
        </style></head><body>
        <div class="top">
          <div><h1>🚐 Bv-trip · Estado de cuenta</h1><div>Transporte Bosque Valle · Tazón, Caracas</div></div>
          <div style="text-align:right">Emitido: ${new Date().toLocaleDateString('es-VE')}<br>Período: <b>${periodo}</b></div>
        </div>
        <div class="info">
          <h2>Conductor</h2>
          <p><b>Nombre:</b> ${esc(c.nombre || '—')}</p>
          <p><b>Cédula:</b> ${esc(c.cedula || '—')} &nbsp; <b>Teléfono:</b> ${esc(c.telefono || '—')}</p>
          <p><b>Vehículo:</b> ${esc(vehiculo)}</p>
        </div>
        <h2>Detalle de viajes</h2>
        <table>
          <thead><tr><th>Fecha</th><th>Hora</th><th>Ruta</th><th>Pasajero</th><th>Puesto</th><th class="r">Monto (Bs.)</th></tr></thead>
          <tbody>${filas}
            <tr class="tot"><td colspan="5">Total: ${lista.length} viaje(s) · ${pas} pasajero(s)</td><td class="r">${total.toLocaleString('es-VE')}</td></tr>
          </tbody>
        </table>
        <div class="firmas"><div>Firma Bv-trip</div><div>Firma del conductor</div></div>
        <p class="nota">Reporte generado desde el panel de administración de Bv-trip.</p>
        </body></html>`;

      const w = window.open('', '_blank');
      if (!w) return alert('El navegador bloqueó la ventana. Permite las ventanas emergentes para este sitio e inténtalo de nuevo.');
      w.document.open(); w.document.write(html); w.document.close();
      w.focus();
      setTimeout(() => w.print(), 400);
    }

    async function cambiarEstadoConductor(id, estado) {
      try {
        await db.collection('conductores').doc(id).update({ estado });
        await cargarDatos();
      } catch (err) {
        alert('Error al cambiar el estado: ' + err.message);
      }
    }
  </script>
</body>
</html>
